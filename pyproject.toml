[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpi5-housing-studio"
version = "1.2.1"
description = "Parametric 2D/3D housing generator with a FastAPI preview UI and LiteLLM configuration compiler."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{ name = "Housing Studio" }]
dependencies = [
  "cadquery>=2.8.0,<3",
  "ezdxf>=1.4.5,<2",
  "trimesh>=4.12.2,<5",
  "fastapi>=0.120.4,<1",
  "uvicorn[standard]>=0.30.6,<1",
  "jinja2>=3.1.6,<4",
  "pydantic>=2.14.4,<3",
  "reportlab>=4.5.1,<5",
  "numpy>=1.26.4,<3",
  "python-dotenv>=1.2.4,<2"
]

[project.optional-dependencies]
llm = [
  "litellm>=1.110.2,<2"
]
dev = [
  "pytest>=8.4.2,<10",
  "httpx>=0.27.2,<1",
  "ruff>=0.9.10,<1"
]

[project.scripts]
housing-generator = "generator:main"

[tool.setuptools]
py-modules = ["generator"]

[tool.setuptools.packages.find]
where = ["."]
include = ["housing_studio*", "app*"]

[tool.setuptools.package-data]
app = ["static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
